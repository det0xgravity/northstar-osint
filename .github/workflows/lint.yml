name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck

      - name: shellcheck
        run: shellcheck -x -S warning install.sh lib/common.sh lib/ui.sh modules/*.sh tools/* tests/run.sh

      - name: Bash syntax
        run: for f in install.sh lib/*.sh modules/*.sh tools/*; do bash -n "$f"; done

      - name: Bash 3.2 compatibility scan (macOS)
        run: |
          if grep -nE 'declare -A|local -A|mapfile|readarray|\$\{[A-Za-z_]+(,,|\^\^)|&>>' \
               install.sh lib/*.sh modules/*.sh tools/*; then
            echo "::error::Bash 4+ construct found — True Bearing must run on macOS Bash 3.2"
            exit 1
          fi

      - name: Python and JSON
        run: |
          python3 -m py_compile lib/gen_policies.py lib/tb_country.py lib/tb_breach.py lib/tb_darkweb.py lib/tb_evidence.py lib/tb_case.py lib/tb_doctor.py lib/tb_geo.py lib/tb_face.py lib/tb_missing.py lib/tb_photomatch.py lib/tb_watch.py lib/tb_casemap.py lib/tb_translate.py lib/tb_telegram.py lib/tb_vault.py lib/tb_guides.py lib/tb_triage.py lib/tb_email.py
          python3 -m json.tool config/bookmarks.json > /dev/null
          python3 lib/tb_country.py validate

      - name: Installer smoke test
        run: ./install.sh --list

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: pandoc (for the guides test)
        run: if command -v apt-get >/dev/null; then sudo apt-get update -q && sudo apt-get install -y -q pandoc nftables age gnupg; else brew install pandoc age gnupg; fi
      - name: Functional tests (macOS runs them under its Bash 3.2)
        run: /bin/bash tests/run.sh
